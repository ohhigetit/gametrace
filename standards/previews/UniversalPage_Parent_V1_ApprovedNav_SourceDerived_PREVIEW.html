/* GameTrace V46.1 — approved banner-only typography standard.
   V46 Home Court + Games design and all underlying functionality remain unchanged.
   Scoreboard "In Action" is the reference: title 20/700, subtitle 13/400,
   primary 22/700, secondary 16/600, label 12/500,
   status 12/600, details 12/400. Only type properties; no grid/layout changes. */
html[data-theme] #app.gt-app{
  --gt-banner-title-size:20px;
  --gt-banner-subtitle-size:13px;
  --gt-banner-primary-size:22px;
  --gt-banner-secondary-size:16px;
  --gt-banner-label-size:12px;
  --gt-banner-detail-size:12px;
}
/* Common banner headings. No page-title or control changes. */
html[data-theme] #app.gt-app :is(
  .scoreboard-banner-heading h2,
  #courtContent .hc45-bannerhead h2,
  #homeContent .gt46-approved-banhead h2,
  #homeContent .gt46-approved-banner h2,
  #homeContent .v42-banner-heading h2,
  .v42-current-banner .v42-banner-heading h2,
  .v42-performance > h2,
  .report-performance > h2,
  .training-hero h2,
  .v44-banner-head h2,
  .trophy-cabinet-hero h2,
  .review-work-banner > h2,
  .review-work-banner .review-section-title,
  .reports-summary-heading h2
){font-size:var(--gt-banner-title-size)!important;font-weight:700!important;line-height:1.25!important;letter-spacing:normal!important}
/* Descriptive subtitles. */
html[data-theme] #app.gt-app :is(
  #courtContent .hc45-bannerhead p,
  #homeContent .gt46-approved-banhead p,
  #homeContent .gt46-approved-banner p,
  .v44-banner-subtitle,
  .training-hero > div > p,
  .trophy-cabinet-hero p,
  .review-work-banner > p
){font-size:var(--gt-banner-subtitle-size)!important;font-weight:400!important;line-height:1.45!important}
/* Primary numbers: keep deliberately oversized game scores and Live scoring legible. */
html[data-theme] #app.gt-app :is(
 .scoreboard-banner-metrics strong,
 #courtContent .hc45-tile .hc45-number,
 #homeContent .gt46-approved-figures strong,
 .v44-banner-big,
 .reports-summary-card .reports-summary-value
){font-size:var(--gt-banner-primary-size)!important;font-weight:700!important;line-height:1.2!important}
/* Secondary numerical information. */
html[data-theme] #app.gt-app :is(
 #courtContent .hc45-sidemetrics strong,
 #courtContent .hc45-goalcounts strong,
 #homeContent .gt46-approved-scoremini,
 .v44-banner-details strong,
 .training-hero .training-streak strong,
 .review-work-banner .review-work-total strong
){font-size:var(--gt-banner-secondary-size)!important;font-weight:600!important;line-height:1.3!important}
/* Labels and eyebrows in banners; don't touch labels outside of banners. */
html[data-theme] #app.gt-app :is(
 .scoreboard-banner-metrics small,
 #courtContent .hc45-banner .hc45-label,
 #homeContent .gt46-approved-hero .gt46-approved-label,
 #homeContent .gt46-approved-hero .gt46-approved-eyebrow,
 .v44-banner .v44-kicker,
 .training-hero .training-kicker,
 .v42-current-banner .v42-banner-label,
 .report-performance .report-stat > span,
 .review-work-banner .review-work-label
){font-size:var(--gt-banner-label-size)!important;font-weight:500!important;line-height:1.3!important;letter-spacing:normal!important}
/* Status text is emphasized, but not enlarged. */
html[data-theme] #app.gt-app :is(
 .v42-current-banner .review-status,
 #homeContent .gt46-approved-pill,
 #courtContent .hc45-banner .hc45-status,
 .review-work-banner .review-status
){font-size:12px!important;font-weight:600!important;line-height:1.3!important}
/* Supporting details. Preserve content and display behavior. */
html[data-theme] #app.gt-app :is(
 #courtContent .hc45-mainmetric > small,
 #courtContent .hc45-tile > small,
 #courtContent .hc45-focus > small,
 #homeContent .gt46-approved-meta,
 .v44-banner-note,
 .trophy-cabinet-hero small,
 .review-work-banner small
){font-size:var(--gt-banner-detail-size)!important;font-weight:400!important;line-height:1.4!important}

const pageView=document.querySelector("#approvedPage"),menuToggle=document.getElementById("settingsButton"),menuLabel=document.getElementById("menuLabel"),pageChoice=document.getElementById("pageChoice"),themeChoice=document.getElementById("themeChoice"),orientation=document.getElementById("orientation"),app=document.getElementById("app");
function ico(name){return PHOSPHOR[name]||PHOSPHOR["basketball"];}
function showMenu(open){nav.hidden=!open;pageView.hidden=open;menuToggle.setAttribute("aria-expanded",String(open));menuLabel.textContent=open?"Close":"Menu";}
function render(){document.documentElement.dataset.theme=themeChoice.value;app.classList.toggle("wide",orientation.value==="landscape");const p=PAGES.find(x=>x[0]===pageChoice.value)||PAGES[0];const [title,icon,subtitle,action,ctas]=p;document.querySelector("#approvedHeader").innerHTML='<div class="ph-header-line"><button type="button" class="ph-back" aria-label="Back" data-back>'+ico("arrow-left")+'</button><div class="ph-text"><div class="ph-title">'+ico(icon)+'<h1>'+title+'</h1></div><p class="ph-subtitle">'+subtitle+'</p></div>'+(action?'<button type="button" class="ph-action" aria-label="'+action+'" data-header-action="'+action+'">'+ico(action==="Filter"?"sliders-horizontal":"pencil-line")+'</button>':'')+'</div><div class="ph-cta-row" style="grid-template-columns:repeat('+Math.max(1,ctas.length)+',minmax(0,1fr))">'+ctas.map(txt=>'<button type="button" data-cta="'+txt+'">'+ico(txt==="New Game"?"basketball":txt.includes("Session")?"barbell":txt.includes("Goal")?"target":txt.includes("Event")?"calendar-plus":"plus-circle")+'<span>'+txt+'</span></button>').join("")+'</div>';
document.querySelector("#primaryContent").innerHTML='<h2>Primary content</h2><p>Flexible page-owned content area for '+title+'. No additional content sections are imposed by the parent template.</p>';
document.querySelectorAll("[data-nav]").forEach(b=>{if(b.dataset.nav===title)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});}
menuToggle.addEventListener("click",()=>showMenu(nav.hidden));document.getElementById("brandHome").addEventListener("click",()=>{pageChoice.value="Home Court";render();showMenu(false)});
nav.addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(!b)return;const name=b.dataset.nav;if(PAGES.some(p=>p[0]===name)){pageChoice.value=name;render();showMenu(false)}else{alert(name+" is outside this parent-template preview.")}});
pageView.addEventListener("click",e=>{if(e.target.closest("[data-back]")){showMenu(true);return}const h=e.target.closest("[data-header-action]"),c=e.target.closest("[data-cta]");if(h||c)alert((h?.dataset.headerAction||c?.dataset.cta)+" — preview only");});
[pageChoice,themeChoice,orientation].forEach(x=>x.addEventListener("change",()=>{render();showMenu(false)}));
render();showMenu(false);</script></body></html>
