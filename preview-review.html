<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameTrace Review Preview</title><style>body{font:15px system-ui;background:#f5f8f5;color:#183020;padding:28px}main{max-width:540px;margin:15vh auto}h1{font-size:22px}p{line-height:1.6}button{padding:12px 16px;border:0;border-radius:10px;background:#257a52;color:white}</style></head><body><main><h1>Loading GameTrace review…</h1><p id="status">Opening the full application from the review branch.</p></main><script>
(async function(){
 const status=document.getElementById('status');
 const url='https://raw.githubusercontent.com/ohhigetit/gametrace/review/latest-dev-baseline-20261112/index.html?review=191c151';
 try{
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw Error('GitHub returned '+response.status);
  const html=await response.text();
  if(!html.includes('gt-game-form-parent-review-v2')||!html.includes('GameTrace'))throw Error('Review file could not be verified.');
  document.open();document.write(html);document.close();
 }catch(error){
  status.textContent='Preview could not load: '+error.message+'. Open the review HTML directly in a browser or try again.';
  const b=document.createElement('button');b.textContent='Retry';b.onclick=()=>location.reload();status.after(b);
 }
})();
</script></body></html>
