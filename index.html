html[data-theme] body{background:var(--gt-page)}

html[data-theme] .app.gt-app .top{padding:0 2px 8px;min-height:48px}

html[data-theme] .app.gt-app .settings-button{background:var(--gt-surface);color:var(--gt-ink);border-color:var(--gt-edge);min-height:44px;font-size:12px}

html[data-theme] .app.gt-app #liveView{min-height:0}
html[data-theme] .app.gt-app .player{background:none;border:0;padding:8px 0;margin:0}

html[data-theme] .app.gt-app .live-kicker{font-size:10px;letter-spacing:1.4px;color:var(--gt-muted);margin:0 0 4px}
html[data-theme] .app.gt-app .score{background:none;border:0;border-bottom:1px solid var(--gt-edge);border-radius:0;padding:10px 0;gap:10px}

html[data-theme] .app.gt-app .score strong{color:var(--gt-ink);font-size:14px}
html[data-theme] .app.gt-app #periodControl{background:var(--gt-surface);border-color:var(--gt-edge);color:var(--gt-ink);font-size:12px;min-height:44px}

html[data-theme] .app.gt-app .live-stats-toggle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;width:100%;border:0;background:none;padding:14px 0 6px;text-align:left;color:var(--gt-ink)}
html[data-theme] .app.gt-app .live-stats-toggle b{font-size:29px;line-height:1.1;letter-spacing:-.5px;display:block}
html[data-theme] .app.gt-app .live-stats-toggle small{font-size:10px;letter-spacing:.5px;color:var(--gt-muted);display:block;margin-top:5px}
html[data-theme] .app.gt-app .stats-disclosure{grid-column:1/-1;color:var(--gt-muted);font-size:11px;display:flex;justify-content:space-between;margin-top:4px;min-height:24px;align-items:center}
html[data-theme] .app.gt-app .live-stats-toggle[aria-expanded=true] .stats-disclosure{color:var(--gt-accent)}

html[data-theme] .app.gt-app .live-secondary-stat span{font-size:10px;color:var(--gt-muted)}
html[data-theme] .app.gt-app .micro{display:flex;align-items:center;gap:8px;width:100%;margin:0;padding:10px 0;min-height:44px;border:0;border-top:1px solid var(--gt-edge);border-bottom:1px solid var(--gt-edge);background:none;color:var(--gt-ink);text-align:left;font-size:12px}

html[data-theme] .app.gt-app #courtStatus{display:block;font-size:11px;letter-spacing:.4px;color:var(--gt-accent);font-weight:600}
html[data-theme] .app.gt-app #courtStatus.is-bench{color:var(--gt-muted)}
html[data-theme] .app.gt-app #holdProgress{display:block;width:100%;height:3px;margin-top:5px;border:0;appearance:none;background:transparent;accent-color:var(--gt-accent-fill)}
html[data-theme] #holdProgress::-webkit-progress-bar{background:transparent}

html[data-theme] .app.gt-app .controller-stage{padding-top:0;margin-top:0;flex-shrink:0}

html[data-theme] .app.gt-app .action[aria-disabled=true]{opacity:.35}

html[data-theme] .app.gt-app .recent-action{display:block;width:100%;border:0;border-left:2px solid var(--gt-control-outline);border-bottom:1px solid var(--gt-edge);border-radius:0;text-align:left;padding:10px 12px;min-height:58px;background:var(--gt-surface);color:var(--gt-ink)}
html[data-theme] .app.gt-app .recent-action strong{display:block;font-size:14px}
html[data-theme] .app.gt-app .recent-action small{display:block;margin-top:3px;font-size:11px;color:var(--gt-muted)}
html[data-theme] .app.gt-app .completed-banner{background:var(--gt-control);border-color:var(--gt-edge);color:var(--gt-ink)}

html[data-theme] .app.gt-app .notice{background:var(--gt-control);border-color:var(--gt-edge);color:var(--gt-ink)}
html[data-theme] .app.gt-app .error-notice,html[data-theme] .app.gt-app button.danger,html[data-theme] .app.gt-app .period-editor button.danger{background:light-dark(#fce7eb,#42222c);border-color:light-dark(#b75e70,#a85b70);color:light-dark(#8e2039,#ffd3de)}

<main class="app gt-app" id="app">
<header class="top"><button class="brand brand-button" id="brandHome" aria-label="Open games">Game<span>Trace</span></button><button id="settingsButton" class="settings-button" type="button" aria-haspopup="dialog">Settings</button></header>
<div class="save-bar"><button class="save-status" id="saveStatus" aria-label="Saving status">Ready</button><button id="retrySave" hidden>Retry</button><span class="device-note">On this device</span></div><p class="save-error-line" id="saveErrorLine" role="status"></p>
<section class="app-view" id="homeView"><div id="homeContent" class="content"></div><nav class="view-footer" aria-label="Game library tools"><button id="homeNew" class="primary">New game</button></nav></section>
<section class="app-view" id="liveView" hidden>
<div class="live-info">
  <section class="player"><div><p class="live-kicker">LIVE GAME</p><strong id="playerName"></strong></div></section>
  <section class="score"><div class="side"><small>TEAM</small><strong id="teamName"></strong></div><div class="meta"><button id="periodControl" type="button" aria-haspopup="dialog" aria-label="Change period"><small>PERIOD</small><strong id="period">Q1</strong><span aria-hidden="true">▾</span></button></div><div class="side"><small>OPPONENT</small><strong id="opponentName"></strong></div></section>
  <button id="liveStatsToggle" class="live-stats-toggle" type="button" aria-expanded="false" aria-controls="liveSecondary" aria-label="Expand secondary stats">
    <span><b id="pts">0</b><small>POINTS</small></span><span><b id="reb">0</b><small>REBOUNDS</small></span><span><b id="ast">0</b><small>ASSISTS</small></span><span><b id="stl">0</b><small>STEALS</small></span>
    <span class="stats-disclosure">Secondary stats <span aria-hidden="true">⌄</span></span>
  </button>
  <div id="liveSecondary" class="live-secondary" hidden></div>
  <button class="micro" id="lastAction" type="button" aria-haspopup="dialog"><span class="trace-dot" aria-hidden="true"></span><span><strong id="last">Ready</strong><span id="lastPeriod"></span></span><small>View actions →</small></button>
  <div class="completed-banner" id="gameCompleted" hidden><span>Game completed</span><button id="completedReview">Review plays</button></div>
</div>
<div class="court-feedback"><span id="courtStatus" role="status">ON BENCH · HOLD CENTER TO ENTER</span><progress id="holdProgress" max="1" value="0" aria-label="Substitution hold progress"></progress></div>

function completedInfo(){openDialog('Game completed',box=>box.append(el('p',{class:'setup-help'},'Review or correct its history, or reopen the game to record more plays.'),el('div',{class:'period-tools'},button('Review history',()=>showHistory(null,'all'),'primary'),button('Reopen game',reopenGame),button('Close',closeDialog,'cancel-choice'))))}
function endGame(){const g=game();if(!g)return;choices('End this game?',[['End game',()=>{commit(()=>{g.events.push(C.newEvent(g,'period_end'),C.newEvent(g,'game_end'));g.status='completed';g.completedAt=C.now()},g.id);ui.period='all';navigate('stats');announce('Game completed')},true],['Cancel',closeDialog,false]])}

    function syncControllerAssets(){
      const ink=getComputedStyle($('app')).color;
      for(const image of document.querySelectorAll('.gt-controller-asset')){
        const svg=atob(image.dataset.asset).replace(/stroke="currentColor"/g,'stroke="'+ink+'"').replace(/stroke-width="2"/g,'stroke-width="1.9"');
        image.setAttribute('href','data:image/svg+xml;base64,'+btoa(svg));
      }
    }

const THEME_KEY='gametrace_appearance';
let appearance='courtside';
function applyAppearance(value){appearance=value==='day'?'day':'courtside';document.documentElement.dataset.theme=appearance;$('app').dataset.appearance=appearance==='day'?'light':'dark';document.querySelector('meta[name="theme-color"]').content=appearance==='day'?'#f7f8f5':'#101211';syncControllerAssets()}
try{applyAppearance(localStorage.getItem(THEME_KEY))}catch{applyAppearance('courtside')}
function setAppearance(value){applyAppearance(value);try{localStorage.setItem(THEME_KEY,appearance)}catch{announce('Appearance changed for this session; device storage is unavailable.')}settings()}
function settings(){const g=game();openDialog('Settings',box=>{
 const appearanceGroup=el('div',{class:'appearance-options',role:'group','aria-label':'Appearance'});
 for(const[value,label]of [['courtside','Courtside · Dark'],['day','Day Game · Light']])appearanceGroup.append(button(label,()=>setAppearance(value),'',{'aria-pressed':appearance===value,'data-appearance':value}));
 box.append(el('h3',{class:'menu-heading'},'Appearance'),appearanceGroup);
 const reports=el('div',{class:'menu-grid'});
 for(const[label,fn]of [['Stats',showStats],['Recorded plays',()=>showHistory(null,'all')]]){const b=button(label,fn);b.disabled=!g;reports.append(b)}
 box.append(el('h3',{class:'menu-heading'},g?'Reports · '+g.player+' vs '+g.opponent:'Reports'),reports);
 if(!g)box.append(el('p',{class:'setup-help'},'Start or select a game to view its reports.'));
 const tools=el('div',{class:'menu-grid'},button('Games & resume',()=>navigate('home')),button('Backup & export',dataMenu));
 if(g){for(const[label,fn]of [['Period setup',()=>gameForm(g.id,true)],['Game details',()=>gameForm(g.id)],[g.status==='completed'?'Reopen game':'End game',g.status==='completed'?reopenGame:endGame]])tools.append(button(label,fn))}
 box.append(el('h3',{class:'menu-heading'},'Game & data'),tools);
 if(g?.status==='in_progress'){const extra=el('div',{class:'menu-grid'});for(const[code,label]of [['drive','Drive'],['defstop','Def Stop'],['block','Block'],['deflection','Deflection'],['boxout','Box-out'],['highlight','Highlight']]){const b=button(label,()=>record(code));b.disabled=!C.onCourt(g);extra.append(b)};box.append(el('h3',{class:'menu-heading'},'Extra actions'),extra)}
 const soundButton=button('Sound '+(db.prefs.sound?'On':'Off'),()=>{commit(()=>db.prefs.sound=!db.prefs.sound);soundButton.textContent='Sound '+(db.prefs.sound?'On':'Off');soundButton.setAttribute('aria-pressed',String(db.prefs.sound));if(db.prefs.sound)sound()},'',{'aria-pressed':db.prefs.sound});
 box.append(el('div',{class:'period-tools'},soundButton,button('Close',closeDialog,'cancel-choice')));
 })}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=el('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000)}
function exportBackup(){download(JSON.stringify(C.backup(db),null,2),'GameTrace_backup_'+localDate()+'.json','application/json')}
function dataMenu(){openDialog('Backup & export',box=>{box.append(el('p',{class:'setup-help'},'Backups contain all games and plays. CSV files export all games for spreadsheets.'),el('div',{class:'menu-grid'},button('Export backup (JSON)',exportBackup,'primary'),button('Import backup',()=>$('importInput').click()),button('Export stats (CSV)',()=>download(C.statsCSV(db),'GameTrace_stats.csv','text/csv')),button('Export plays (CSV)',()=>download(C.eventsCSV(db),'GameTrace_plays.csv','text/csv'))));if(recoveryRaw)box.append(button('Download recovery copy',()=>download(recoveryRaw,'GameTrace_recovery.txt','text/plain'),'wide'));box.append(el('div',{class:'period-tools'},button('Close',closeDialog,'cancel-choice')))})}
function importPreview(imported){const existing=new Set(db.games.map(g=>g.id)),fresh=imported.games.filter(g=>!existing.has(g.id));openDialog('Import backup',box=>{
 box.append(el('p',{class:'setup-help'},imported.games.length+' games in this backup. '+fresh.length+' new games. Existing game IDs are kept unchanged when importing new games.'));
 const add=button('Import '+fresh.length+' new '+(fresh.length===1?'game':'games'),()=>{commit(()=>{db.games.push(...C.clone(fresh));if(!db.activeGameId)db.activeGameId=fresh[0]?.id||null});navigate('home');announce('New games imported')},'primary wide');add.disabled=!fresh.length;box.append(add,button('Restore entire backup',()=>restorePreview(imported),'danger wide delete-start'),el('div',{class:'period-tools'},button('Cancel',closeDialog,'cancel-choice')));
 })}
function restorePreview(imported){openDialog('Replace saved library?',box=>{box.append(el('p',{class:'setup-help'},'This replaces '+db.games.length+' current games with '+imported.games.length+' games from the backup. Download the current backup first.'),el('div',{class:'period-tools'},button('Download current backup & restore',()=>{exportBackup();db=C.clone(imported);persist(true);ui.period='all';ui.historyPeriod='all';ui.stat=null;navigate('home');announce(saveState==='Saved'?'Backup restored':'Restored in memory — not saved')},'danger'),button('Cancel',()=>importPreview(imported),'cancel-choice')))})}
async function importFile(file){try{if(file.size>100*1024*1024)throw Error('This backup is too large to open.');const parsed=C.readBackup(JSON.parse(await file.text()));importPreview(parsed)}catch(e){openDialog('Backup not imported',box=>box.append(el('p',{class:'setup-help'},e.message||'This file could not be read.'),button('Close',closeDialog,'wide')))}}
function saveDetails(){openDialog('Saving status',box=>{box.append(el('p',{class:'setup-help'},saveState==='Not saved'?saveError:'Your games are saved on this device. Use a JSON backup to keep a separate copy.'),el('div',{class:'period-tools'},button('Retry saving',()=>{persist();render();if(saveState==='Saved')closeDialog()},'primary'),button('Export backup',exportBackup),button(saveState==='Not saved'?'Export changes & load saved':'Load saved library',()=>{try{if(saveState==='Not saved')exportBackup();const raw=localStorage.getItem(C.KEY);if(!raw)throw Error('No saved library found.');db=C.validDB(JSON.parse(raw));baseRevision=db.revision;recoveryRaw=null;saveState='Saved';saveError='';ui.screen='home';closeDialog();render()}catch(e){announce(e.message)}}),button('Close',closeDialog,'cancel-choice')))} )}
$('brandHome').addEventListener('click',()=>navigate('home'));$('periodControl').addEventListener('click',periodSelector);$('settingsButton').addEventListener('click',settings);$('retrySave').addEventListener('click',()=>{persist();render()});$('saveStatus').addEventListener('click',saveDetails);
$('homeNew').addEventListener('click',()=>gameForm());$('statsBack').addEventListener('click',backGame);$('statsHistory').addEventListener('click',()=>showHistory(null,ui.period));$('historyBack').addEventListener('click',backGame);$('historyAdd').addEventListener('click',()=>eventEditor());$('completedReview').addEventListener('click',()=>showHistory(null,'all'));
$('lastAction').addEventListener('click',recentActions);$('liveStatsToggle').addEventListener('click',()=>{ui.liveExpanded=!ui.liveExpanded;renderLive(game())});
$('importInput').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)});
window.addEventListener('storage',e=>{if(e.key!==C.KEY||!e.newValue)return;try{const updated=C.validDB(JSON.parse(e.newValue));if(updated.revision===baseRevision)return;if(saveState==='Saved'&&!sheet.open){if(updated.games.some(g=>g.id===db.activeGameId))updated.activeGameId=db.activeGameId;db=updated;baseRevision=db.revision;render()}else{saveState='Not saved';saveError='Saved data changed in another window. Export these changes or load the saved library.';drawSave()}}catch{}});
load();
})();
