function aligned(x,y,r,cut=3){ball(x,y,r,0,1,true);net(x,y,r);ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();ctx.fillStyle=bg;ctx.fillRect(-cut/2,-r,cut,2*r);ctx.fillRect(-r,-cut/2,2*r,cut);ctx.restore()}
function sector(i,alpha=1,offset=0,active=false){if(!greenTexture)return;const k=620/1254,a=(-90+i*45)*Math.PI/180,m=a+Math.PI/8;ctx.save();ctx.globalAlpha=alpha;ctx.translate(450+Math.cos(m)*offset,320+Math.sin(m)*offset);ctx.beginPath();ctx.arc(0,0,490*k,a-.01,a+Math.PI/4+.01);ctx.arc(0,0,219*k,a+Math.PI/4+.01,a-.01,true);ctx.closePath();ctx.clip();ctx.drawImage(active?orangeTexture:greenTexture,-310,-310,620,620);ctx.restore()}
const crossStart=13200,crossEnd=14200;
const activationDurations=[480,430,450,420,460,440,480,520,680,840],activationStart=7700,activationEnd=activationStart+activationDurations.reduce((a,b)=>a+b,0);

function stage(ms){return ms<2600?'Finding the rhythm':ms<3200?'The gather':ms<4350?'The shot':ms<4950?'Aligned — hold':ms<5750?'Settling into place':ms<6200?'A breath':ms<7100?'The controls assemble':ms<activationStart?'Ready':ms<activationEnd?'Orange activation · clockwise':ms<crossStart?'Locked on':ms<crossEnd?'The T takes shape':ms<15400?'GameTrace':'The journey begins'}
function draw(ms){if(dismissed)return;if(ms>=D){enter.disabled=false;root.dataset.complete='true'}const b=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(b.width*dpr)||canvas.height!==Math.round(b.height*dpr)){canvas.width=Math.round(b.width*dpr);canvas.height=Math.round(b.height*dpr)}ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const scene=1-smooth(range(ms,4950,5750));if(scene>0){ctx.save();ctx.globalAlpha=scene;const glow=ctx.createRadialGradient(430,340,0,430,340,390);glow.addColorStop(0,'#39402b26');glow.addColorStop(1,'#0000');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.restore()}
if(ms<4350){const appear=smooth(range(ms,1100,2100));ctx.save();ctx.globalAlpha=appear;net(641,350,82);ctx.restore();if(ms<2600){const q=range(ms,0,2600),beats=[0,.31,.59,.84,1];let j=0;while(j<3&&q>beats[j+1])j++;const u=(q-beats[j])/(beats[j+1]-beats[j]),x=mix(210,425,smooth(q)),y=468-Math.sin(u*Math.PI)*[151,125,91,45][j],r=mix(58,45,q),sq=1-.16*Math.pow(Math.abs(Math.cos(u*Math.PI)),12);shadow(x,526,r);ball(x,y,r,q*4.6,sq)}else if(ms<3200){const q=range(ms,2600,3200);shadow(425,526,55);ball(425+9*Math.sin(q*Math.PI),468+12*Math.sin(q*Math.PI)-65*smooth(range(q,.55,1)),45,4.6,.88+.12*q)}else{const raw=range(ms,3200,4350),u=range(raw,.8,1),q=raw<.8?raw:.8+.2*(u+u*u-u*u*u),x=mix(425,641,q),y=mix(403,350,q)-230*Math.sin(q*Math.PI),r=mix(45,82,smooth(q));ctx.save();if(q>.7){ctx.beginPath();ctx.rect(0,0,W,350);ctx.clip()}ball(x,y,r,4.6*(1-smooth(q)));ctx.restore();net(641,350,82)}}
else if(ms<5750){const q=smooth(range(ms,4950,5750));aligned(mix(641,450,q),mix(350,314,q),mix(82,86.5,q)*(1+.012*Math.sin(range(ms,4350,4800)*Math.PI*2)*Math.exp(-5*range(ms,4350,4800))),3)}

else centrePatch();

root.dataset.crossProgress=range(ms,crossStart,13850);

const name=smooth(range(ms,14550,15200)),tag=smooth(range(ms,15400,16100));brand.style.opacity=name;brand.style.transform='translateY('+((1-name)*13)+'px)';tagline.style.opacity=tag;seek.value=Math.round(ms);clock.textContent='0:'+String(Math.floor(ms/1000)).padStart(2,'0')+' / 0:18';root.dataset.activeControl=active<0?'':String(active+1);root.dataset.visibleControls=visible;root.dataset.scene=stage(ms);const label=stage(ms);if(label!==lastPhase){phase.textContent=label;lastPhase=label}}
function tick(now){if(!previous)previous=now;if(playing)t=Math.min(D,t+now-previous);previous=now;draw(t);if(t>=D){playing=false;play.textContent='Play';play.setAttribute('aria-label','Replay animation')}if(playing)raf=requestAnimationFrame(tick)}
function run(){cancelAnimationFrame(raf);previous=0;playing=true;play.textContent='Pause';play.setAttribute('aria-label','Pause animation');raf=requestAnimationFrame(tick)}
play.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);play.textContent='Play';play.setAttribute('aria-label','Play animation')}else{if(t>=D)t=0;run()}});replay.addEventListener('click',()=>{t=0;run()});seek.addEventListener('input',()=>{playing=false;cancelAnimationFrame(raf);t=Number(seek.value);play.textContent='Play';play.setAttribute('aria-label','Play animation');draw(t)});observer=new ResizeObserver(()=>draw(t));observer.observe(canvas);function boot(){if(booted||dismissed)return;booted=true;textures();if(playing)run();else{t=D;draw(t);play.textContent='Play'}}logo.onerror=()=>{enter.disabled=false;root.dataset.complete='true'};logo.onload=boot;if(logo.complete&&logo.naturalWidth)boot();else draw(0);

})();
