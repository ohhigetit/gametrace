<section id="gt-app-cover" role="region" aria-label="Welcome to GameTrace">
<button type="button" id="gt-cover-skip">Skip</button>
 <div class="gt-film-stage">
  <canvas aria-label="Animated GameTrace cover: a flat basketball with thin seams dribbles and shoots, stops aligned with the green lower semicircle, while the green controls assemble together. Orange activation travels clockwise, stops on the second control, and then the bold T cross is revealed." role="img"></canvas>
  <div class="gt-film-brand" aria-hidden="true"><div class="gt-film-name">Game<span>Trace</span></div><div class="gt-film-tagline">Follow the Play. The Game. The Journey.</div></div>
 </div>
 <div class="gt-cover-entry"><button type="button" id="gt-cover-enter" disabled>Enter GameTrace</button></div>
 <div class="gt-film-tools" hidden>
  <button type="button" class="gt-film-play cursor-interaction" aria-label="Pause animation">Pause</button>
  <button type="button" class="gt-film-replay cursor-interaction">Replay</button>
  <div class="gt-film-seek"><label for="gt-directed-progress"><span class="gt-film-phase" aria-live="polite">Getting ready</span><span class="gt-film-time">0:00 / 0:20</span></label><input class="cursor-interaction" id="gt-directed-progress" aria-label="Animation position" type="range" min="0" max="20000" step="10" value="0"></div>
 </div>
</section>
<style>
#gt-app-cover{--gt-bg:#0d0c0a;--gt-ink:#f5f5ef;--gt-secondary:#a6aaa3;--gt-line:#343a34;--gt-green:#00ecc5;--gt-orange:#ff932b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--gt-ink);width:100%;max-width:736px;margin:0 auto}
#gt-app-cover *{box-sizing:border-box}
#gt-app-cover .gt-film-stage{position:relative;background:var(--gt-bg);width:100%;aspect-ratio:1.16;overflow:hidden;border-radius:20px}
#gt-app-cover canvas{display:block;width:100%;height:100%}
#gt-app-cover .gt-film-corner{position:absolute;top:22px;left:24px;font-size:10px;letter-spacing:1.8px;color:#92968f;font-weight:500;pointer-events:none}
#gt-app-cover .gt-film-corner span{color:var(--gt-orange);padding:0 6px}
#gt-app-cover .gt-film-brand{position:absolute;left:0;right:0;bottom:9%;text-align:center;pointer-events:none;opacity:0;transform:translateY(12px)}
#gt-app-cover .gt-film-name{font-size:clamp(30px,6vw,49px);letter-spacing:-1.8px;font-weight:750;line-height:1.15;color:var(--gt-ink)}
#gt-app-cover .gt-film-name span{color:var(--gt-green)}
#gt-app-cover .gt-film-tagline{font-size:clamp(11px,2.3vw,15px);margin-top:13px;letter-spacing:.15px;opacity:0;color:#c5c9c0}
#gt-app-cover .gt-film-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 2px 3px;color:light-dark(#172119,#edf4ec)}
#gt-app-cover .gt-film-tools button{font:inherit;font-size:12px;font-weight:500;min-height:44px;padding:10px 15px;border:1px solid light-dark(#d4ddd4,#3e493e);background:light-dark(#f7faf6,#19221b);color:inherit;border-radius:11px;touch-action:manipulation}
#gt-app-cover .gt-film-play{min-width:70px}
#gt-app-cover .gt-film-seek{flex:1;min-width:140px;padding-left:7px}
#gt-app-cover .gt-film-seek label{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:5px}
#gt-app-cover .gt-film-time{font-variant-numeric:tabular-nums;opacity:.65;white-space:nowrap}
#gt-app-cover input{display:block;width:100%;height:20px;margin:0;accent-color:#19c66a;touch-action:pan-y}
@media(max-width:390px){#gt-app-cover .gt-film-corner{font-size:9px;top:16px;left:18px;letter-spacing:1.2px}#gt-app-cover .gt-film-seek{flex-basis:100%;padding:4px 0 0}#gt-app-cover .gt-film-brand{bottom:8%}#gt-app-cover .gt-film-tagline{margin-top:9px}}

html.gt-cover-open,html.gt-cover-open body{overflow:hidden;background:#0d0c0a}
#gt-app-cover{position:fixed;inset:0;z-index:10000;max-width:none;margin:0;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#0d0c0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;color-scheme:dark}
#gt-app-cover[hidden]{display:none!important}
#gt-app-cover .gt-film-stage{flex:none;max-width:600px;width:min(100%,calc((100svh - 150px)*1.16));border-radius:0}
#gt-app-cover .gt-film-tools[hidden]{display:none!important}
#gt-app-cover #gt-cover-skip{position:absolute;right:max(22px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));border:0;background:transparent;color:#c5c9c0;font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-width:60px;min-height:44px;padding:10px 12px;border-radius:12px;touch-action:manipulation}
#gt-app-cover .gt-cover-entry{display:flex;justify-content:center;min-height:48px}
#gt-app-cover #gt-cover-enter{border:0;background:#19c66a;color:#08140d;font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:48px;padding:13px 28px;border-radius:15px;touch-action:manipulation;transition:opacity .3s ease}
#gt-app-cover #gt-cover-enter:disabled{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#gt-app-cover #gt-cover-enter{transition:none}}

</style>
