00001),fill:'var(--gc-play)','data-circle':'play'});const attempts=t.a2+t.a3+t.aft,makes=t.m2+t.m3+t.mft;if(attempts){const make=points+(attempt-points)*makes/attempts;if(makes)add('path',{d:wedge(make,points,0,Math.PI*2-.000001),fill:'var(--gc-make)','data-circle':'makes'});if(makes<attempts)add('path',{d:wedge(attempt,make,0,Math.PI*2-.000001),fill:'var(--gc-miss)','data-circle':'misses'});}else add('path',{d:wedge(attempt,points,0,Math.PI*2-.000001),fill:'var(--gc-no-attempt)','data-circle':'no-attempts'});if(!t.pts)add('circle',{cx:c,cy:c,r:points,fill:'var(--gc-zero)'});let angle=-Math.PI/2;[['three',t.m3*3],['two',t.m2*2],['ft',t.mft]].filter(([,pts])=>pts>0).forEach(([key,pts])=>{const span=pts/t.pts*Math.PI*2,a=[c+points*Math.cos(angle),c+points*Math.sin(angle)],b=[c+points*Math.cos(angle+span),c+points*Math.sin(angle+span)];if(span>=Math.PI*2-.00001)add('circle',{cx:c,cy:c,r:points,fill:'var(--gc-'+key+')','data-score-source':key});else add('path',{d:`M${c} ${c} L${a} A${points} ${points} 0 ${span>Math.PI?1:0} 1 ${b} Z`,fill:'var(--gc-'+key+')','data-score-source':key});angle+=span;});add('circle',{cx:c,cy:c,r:field*.2,fill:'var(--gc-label)'});add('text',{x:c,y:c,'text-anchor':'middle','dominant-baseline':'central',fill:'var(--gc-point-text)','font-size':Math.max(18,field*.19),'font-weight':650,'data-points-label':''},t.pts);
}
function moveReportRecord(id,target,after){const g=game();if(!g)return;try{let moved;transaction(g.id,t=>moved=C.moveEvent(t,id,target,after));if(!moved)return;reportState.editorId=id;reportState.adding=false;reportState.adjustedId=id;reportState.recordOpen=true;reportState.status='Record moved · timestamp adjusted and still editable.';reportEditorActive=true;renderStats();announce('Record moved')}catch(e){reportState.status=e.message;announce(e.message)}}
function recordDropTarget(y){document.querySelectorAll('.report-play.drop-before,.report-play.drop-after').forEach(e=>e.classList.remove('drop-before','drop-after'));const rows=[...$('statsContent').querySelectorAll('[data-record-id]')].filter(e=>e.dataset.recordId!==reportDrag.id);const found=rows.reduce((best,row)=>{const r=row.getBoundingClientRect(),distance=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0;return !best||distance<best.distance?{row,distance}:best},null);if(!found)return;const r=found.row.getBoundingClientRect();reportDrag.target=found.row.dataset.recordId;reportDrag.after=y>r.top+r.height/2;found.row.classList.add(reportDrag.after?'drop-after':'drop-before')}
const reportRoot=$('statsContent');reportRoot.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-drag-id]');if(!handle||e.button!==0)return;if(reportEditorActive){announce('Save or cancel the current edit before dragging.');return}e.preventDefault();reportDrag={id:handle.dataset.dragId,handle,pointer:e.pointerId,y:e.clientY,lastY:e.clientY,active:false};handle.setPointerCapture(e.pointerId)});reportRoot.addEventListener('pointermove',e=>{if(!reportDrag||reportDrag.pointer!==e.pointerId)return;e.preventDefault();reportDrag.lastY=e.clientY;if(Math.abs(e.clientY-reportDrag.y)>5)reportDrag.active=true;if(reportDrag.active){reportDrag.handle.closest('.report-play').classList.add('drag-source');recordDropTarget(e.clientY)}});const stopDrag=(e,cancel)=>{if(!reportDrag||e.pointerId!==reportDrag.pointer)return;const d=reportDrag;reportDrag=null;document.querySelectorAll('.drag-source,.drop-before,.drop-after').forEach(n=>n.classList.remove('drag-source','drop-before','drop-after'));if(d.handle.hasPointerCapture(e.pointerId))d.handle.releasePointerCapture(e.pointerId);if(!cancel&&d.active&&d.target)moveReportRecord(d.id,d.target,d.after)};reportRoot.addEventListener('pointerup',e=>stopDrag(e,false));reportRoot.addEventListener('pointercancel',e=>stopDrag(e,true));reportRoot.addEventListener('keydown',e=>{const handle=e.target.closest('[data-drag-id]');if(!handle||!['ArrowUp','ArrowDown'].includes(e.key)||reportEditorActive)return;e.preventDefault();const list=C.ordered(game()),index=list.findIndex(x=>x.id===handle.dataset.dragId),target=list[index+(e.key==='ArrowUp'?-1:1)];if(target)moveReportRecord(handle.dataset.dragId,target.id,e.key==='ArrowDown')});

load();
setInterval(expireSavedGames,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)expireSavedGames()});
})();

(()=>{const sheet=document.getElementById('sheet');
const clear=()=>document.querySelectorAll('.controller-selected').forEach(b=>b.classList.remove('controller-selected'));
sheet.addEventListener('close',clear);
for(const b of document.querySelectorAll('.visual .action'))b.addEventListener('click',()=>{
 if(b.getAttribute('aria-disabled')!=='false'||sheet.open)return;
 clear();b.classList.add('controller-selected');
 setTimeout(()=>{if(!sheet.open)clear()},0);
},true);
