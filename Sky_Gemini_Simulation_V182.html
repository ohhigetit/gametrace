es.scrollHeight}\n  add('sky','Sky V1.8.2 — Pinned Gemini Simulation. I’m your GameTrace companion. Data access is read-only and stays on this device. Ask about games, trainings, Player Notes, goals, or your schedule. Type “my data” to check the connection. Gemini is off in this review; local answers are available.');\n  function open(){priorFocus=document.activeElement;overlay.hidden=false;trigger.setAttribute('aria-expanded','true');priorOverflow=document.body.style.overflow;document.body.style.overflow='hidden';input.focus({preventScroll:true})}\n  function shut(){overlay.hidden=true;trigger.setAttribute('aria-expanded','false');document.body.style.overflow=priorOverflow;(priorFocus?.isConnected?priorFocus:trigger).focus({preventScroll:true})}\n  trigger.addEventListener('click',open);close.addEventListener('click',shut);\n  overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)shut()});\n  overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();shut()}else if(e.key==='Tab'){const targets=[close,input,send];const i=targets.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();send.focus()}else if(!e.shiftKey&&i===2){e.preventDefault();close.focus()}}});\n  form.addEventListener('submit',async e=>{\n    e.preventDefault();\n    const value=input.value.trim();\n    if(!value)return;\n    if(send.disabled)return;\n    add('player',value);\n    input.value='';\n    const command=value.toLowerCase().replace(/[?]$/,'').trim();\n    if(['my data','data status','connect data','what data do you have'].includes(command)){\n      const state=dataBridge.snapshot();\n      add('sky',state.connected?'Read-only GameTrace data connected: '+Object.entries(state.counts).map(([k,n])=>k+': '+n).join(', ')+'. No information has been sent externally.':'GameTrace data is not connected. Diagnostic: '+JSON.stringify(state.diagnostics||{reason:state.reason})+'. No player data was accessed.');\n    }else if(['ai','ai on','gemini','gemini       method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+familyAuth.access_token},
      body:JSON.stringify(payload)
    });
    const data=await response.json().catch(()=>({error:'Sky AI returned an unreadable response'}));
    if(!response.ok)throw Error(data.error||'Sky AI is unavailable.');
    return data;
  };
  window.__gtSkyAICall = async function mockGemini(payload){
    const question=String(payload.prompt||'').slice(0,500);
    const context=Array.isArray(payload.context)?payload.context:[];
    const categories=[...new Set(context.map(r=>r.type))].join(', ');
    const selected=context.slice(0,3).map(r=>String(r.summary||'').slice(0,130));
    const nl=String.fromCharCode(10);
    return {mode:'mock',answer:'[GEMINI SIMULATION - NO EXTERNAL API CALL]'+nl+'Question: '+question+nl+'Context: '+context.length+' summarized GameTrace records ('+categories+').'+(selected.length?nl+'Sample context:'+nl+selected.join(nl):'')+nl+'This confirms the Sky client, context selector and response UI work. This is a simulated answer, not a live Gemini response.'};
  };
  window.__gtSkyAICall.mock=true;
  window.__gtSkyReadOnlyProvider = function(){
    const current = (typeof db!=='undefined' && db && typeof db==='object') ? db : null;
    if(!current) return null;
    const live = list => Array.isArray(list) ? list.filter(r => r && !r.deletedAt) : [];
    const games = live(current && current.games);
    const trainings = live(current && current.trainingSessions);
    const personal = live(current && current.personalRecords);
    const hasText = value => typeof value === 'string' && value.trim().length > 0;
    const reflection = item => {
      const out = {};
      for(const key of ['see','became','more','additional','well','challenge','next']){
        if(hasText(item && item.feedback && item.feedback[key]))out[key]=item.feedback[key];
      }
      return out;
    };
    const notes = [];
    for(const game of games){
      const feedback=reflection(game);
      if(Object.keys(feedback).length || hasText(game.progressNotes)){
        notes.push({id:'game-'+game.id,gameId:game.id,source:'game',date:game.date,
          player:game.player,feedback,notes:game.progressNotes||''});
      }
    }
    for(const session of trainings){
      const feedback=reflection(session);
      if(Object.keys(feedback).length || hasText(session.notes)){
        notes.push({id:'training-'+session.id,trainingId:session.id,source:'training',
          date:session.date,player:session.player,feedback,notes:session.notes||''});
      }
    }
    for(const record of personal){
      if(record.type==='note' && (hasText(record.text)||hasText(record.content)||hasText(record.body)||hasText(record.notes))){
        notes.push({id:record.id,date:record.date,player:record.player,source:'notebook',
          text:record.text||record.content||record.body||record.notes||''});
      }
    }
    // Playbook goals are stored in db.goals, not personalRecords.
    const goals=live(current && current.goals).map(g=>({
      id:g.id,title:g.title,player:g.player,status:g.status,targetDate:g.targetDate,
      achievedAt:g.achievedAt,
      entries:live(g.entries).map(e=>({date:e.date,rating:e.rating,note:e.note}))
    }));
    const schedule=personal.filter(r=>r.type==='schedule').map(r=>({
      id:r.id,title:r.title,date:r.date,start:r.start,end:r.end,player:r.player,
      activity:r.activity,team:r.team,opponent:r.opponent,location:r.location
    }));
    return {
      games:games.map(g=>({id:g.id,date:g.date,player:g.player,team:g.team,
        opponent:g.opponent,status:g.status,finalScore:g.finalScore,
        scoreTracking:g.scoreTracking,events:g.events})),
      trainings:trainings.map(t=>({id:t.id,date:t.date,player:t.player,type:t.type,
        name:t.name,minutes:t.minutes,feedback:reflection(t)})),
      notes,goals,schedule
    };
  };\n`;
  if(!html.includes(marker))throw new Error('Cannot find safe DEV data initialization anchor');
  const bridged=html.replace(marker,adapter+marker);
  const result=bridged
    .replace('</head>',baseTag+'<style id="gt-sky-review-style">'+skyCss+'</style></head>')
    .replace('</body>','<scr'+'ipt id="gt-sky-review-script">'+skyJs+'</scr'+'ipt></body>');
  document.open();document.write(result);document.close();

 }catch(error){
  const target=document.querySelector('#gt-status');
  if(target)target.innerHTML='<h1>Review cannot load</h1><p>The same-page DEV loader could not retrieve the original application. The existing DEV deployment and review files are unchanged.</p><p></p>';
  const last=target?.lastElementChild;if(last)last.textContent=String(error.message||error);
 }
})();
</script>
