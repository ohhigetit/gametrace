name: Training Details Summary Banner V1 review
on:
  push:
    branches: [review/training-details-summary-section-v1-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/gt-training-details-summary jsdom@24 --no-save --no-package-lock
      - name: Check reusable Training Summary section, Training Details page, untouched Trainings overview and Game banners
        env:
          NODE_PATH: /tmp/gt-training-details-summary/node_modules
        run: node tests/training-details-summary-banner-integration.cjs
