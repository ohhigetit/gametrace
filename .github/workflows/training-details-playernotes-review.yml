name: Training Details Player Notes review
on:
  push:
    branches: [review/training-details-playernotes-v1-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/gt-training-playernotes jsdom@24 --no-save --no-package-lock
      - name: Verify Player Notes reuse, save, and approved page preservation
        env:
          NODE_PATH: /tmp/gt-training-playernotes/node_modules
        run: node tests/training-details-playernotes-integration.cjs
